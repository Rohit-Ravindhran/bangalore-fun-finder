explore presents Karnataka`s most adventurous, \"Skandagiri Sunrise Trek - 2025\" ✦ Activity Location: Skandagiri Hill ✦ Start time: 11:00 PM ✦ End time: 01:30 PM ✦ Trek Distance: 5-6 km ✦ Skandagiri Height: 1,450 ft. ✦ Trek Difficulty: Moderate About Skandagiri Sunrise Trek: Do you love adventures and are looking for an exciting and different hiking experience? You need to go no farther than the Skandagiri trek, one of the five peaks in the picturesque Chikballapur area referred to as the \"Panchagiris.\" Nature enthusiasts should not miss this walk, Skandagiri Trek which attracts adventurers of all skill levels with its special fusion of history and natural beauty. A physical trip and a step back is the trek to Skandagiri Hill. It starts with the old Papagni Mutt, a hallowed site from antiquity. What`s Included: ✦ Transportation (Non-AC) ✦ Sunrise Trek ✦ Breakfast ✦ Forest Charges ✦ Guided Trek What`s Excluded: ✦ Water Bottle ✦ Snacks ✦ Anything not mentioned in Inclusions. Itinerary: Day 0 - Bangalore to Skandagiri ➞ Meet at the designated starting point in Bengaluru and travel to Skandagiri by private transportation Day 1 - Trek to Skandagiri Peak ➞ 04:00 AM Reach Skandagiri base and start the trek ➞ 06:00 AM Reach the peak, relax and watch the sunrise view. ➞ 10:30 AM Reach the base back ➞ 10:45 AM Have breakfast at any nearby restaurant ➞ 11:30 PM Start back to Bangalore ➞ 01:30 PM Reach Bangalore Pickup Points: 1. RR Nagar (11:00 PM) - Gopalan Arcade, Mysore road 2. Banashankari (11:30 PM) - Bus Stop 3. BTM (11:40 PM) - Udupi Garden Bus Stop, Near A2B 4. Silk Board (12:00 AM) - Near Krishna Bhavan Restaurant 5. Marathahalli (12:30 AM) - Opposite to Kalamandir 6. Hebball (12:50 AM) - Opposite to Esteem Mall Things to Carry ✦ Torch per person with extra batteries ✦ Government id card ✦ Sports shoes or trekking shoes ✦ Backpack ✦ 2 litre water bottle per person ✦ Energy bars, and drinks ✦ Warm jackets for the night ✦ Track pants and cotton T-shirt ✦ Camera (optional) NOTE: Select Friday Date for Saturday Morning Trek | Select Saturday Date for Sunday Morning Trek ✦ You’ll need to provide a government ID for your Trek Permit (Voter ID, Ration Card, Driving License, PAN Card, or Passport). (Aadhaar Card is not accepted). ✦ Please help us keep the place clean! Do not litter during the trek. ✦ We’re all about nature, so don’t expect luxury. Washrooms are available only at the hotel/homestay campsites. ✦ By joining the trek, you understand and accept the risks involved, which can vary by destination. ✦ escape2explore is not responsible for any lost or misplaced personal items."])</script><script>self.__next_f.push([1,"16:T5ab,"])</script><script>self.__next_f.push([1,"Experience the Grandeur of a Karnataka Wedding Feast at Skydeck by Sherlock`s! Craving an authentic culinary adventure? Join us at Skydeck by Sherlock`s for a one-of-a-kind unlimited meal experience! We`re bringing you the rich, traditional flavors of a post-wedding Karnataka feast, served just as it should be on a fresh banana leaf. This is your chance to indulge in an all-you-can-eat spread of exquisite Karnataka cuisine, prepared with age-old recipes and boundless flavor. This limited-time event is designed to transport you to the heart of Karnataka`s culinary heritage. Don`t miss out on this incredible opportunity to savor an unlimited, authentic meal. Spaces are limited, so grab your spot now and prepare for a truly unforgettable gastronomic journey! Unlimited Food - 1199rs Unlimited Food \u0026 Beer - 1999rs Unlimited Food, Drinks \u0026 Cocktails (IMFL) - 2499rs All-you-can-eat unlimited meals includes: Welcome Drinks: Panaka Spiced-Buttermilk Starters/Sides: Mutton Kheema Unde (Minced Mutton Balls) Mutton Pepper Fry Chicken Ghee Roast Nati-Style Egg Masala Kosambari (Moong + Cucumber Salad) Mains: Mutton Donne Biryani Chicken Donne Biryani Nati Koli Saaru (Country Chicken Curry) Mutton Chops Chicken Fry Ragi Mudde Akki Rotti Kerala Parotta Chapati Accompaniments: Kachumber Salad Mixed Vegetable Palya Lime, Onion \u0026 Green Chilli Raita, Pickle \u0026 Papad Steamed Rice Rasam Desserts: Obbattu (Holige) Elneer Payasa (Tender Coconut Kheer)"])</script><script>self.__next_f.push([1,"17:T645,"])</script><script>self.__next_f.push([1,"India's No.1 Live Escape Game, where a team of 2-8 people is locked in a mysterious space for an hour with a mission to accomplish, You must find clues, hints, and mysterious objects, solve puzzles, and challenge all your senses in order to escape in time. Mystery Rooms is a unique adventure game sure to give you an adrenaline rush like never before. So put on your thinking caps, prime your imagination, and sharpen your wits to unravel ultimate mysteries with immersive story lines. Mystery Rooms is a challenging race against the clock where the sole motive is to get yourself out of a theme-based room before time kicks you out! Imagine being locked in a thrill space with your team, and you have exactly 60 minutes to use logic, solve puzzles, find hints, and prove the power of teamwork to pave your path to freedom. It’s as easy as it's hard. Everything you need to escape is inside the room, waiting to meet your eyes! Just analyze, interpret, and conclude! This unique adventure is based on the super hit \"Room Escape\" games rocking the net all over the world. Starting in Japan, over 10,000,000 participants have played this game in China, Hong Kong, Taiwan, Singapore, Europe, and the United States. We take pride in bringing this extraordinary live escape game experience to your town! The concept is very unique and thrilling, but not at all dangerous, and it does not contain any horror elements. It requires no physical exertion and is suitable for ages 10-77. It is an exciting team-building activity for corporations and a fulfilling fun experience for couples, friends, and families."])</script><script>self.__next_f.push([1,"18:T445,"])</script><script>self.__next_f.push([1,"The Experience\n\nAn evening at Central Perk for true fans of the iconic six. Test your knowledge of pivots, lobsters, and smelly cats in a competition that separates casual viewers from true Friends devotees.\n\nThree rounds. One unforgettable night.\n\nThe Challenge\n\nRound 1: Ascending Difficulty\n\nKBC-style questions that escalate from foundational knowledge to expert-level trivia. Thanksgiving mishaps, Janice appearances, and obscure episode details.\n\nRound 2: Charades\n\nBring iconic scenes and characters to life through performance. Master Ross's \"We were on a break,\" recreate Monica's competitiveness, or embody Phoebe's quirkiness. Authenticity wins.\n\nRound 3: The Central Perk Challenge\n\nScenario-based questions demanding deep understanding of relationships, running gags, and character evolution. Think beyond memory—prove mastery.\n\nDetails\n\nExpert Host — A dedicated guide ensures seamless execution and spirited competition.\n\nTeams of Two — Arrive with a partner, or we'll match you with a fellow enthusiast.\n\nGrand Prize — Exclusive hamper + monthly unlimited event access."])</script><script>self.__next_f.push([1,"19:T5c0,"])</script><script>self.__next_f.push([1,"\"Seize the day, my friend. Pehle is din ko poori tarah jiyo, phir chalis ke bare mein sochna.\" - Zindagi Na Milegi Dobara\n\nAll aboard for a night of love, laughter, and unforgettable moments as we bring you the iconic Bollywood masterpiece. Sunset Cinema Club invites you to join us for a cinematic experience that will touch your heart and leave you with a smile at Old Mill Brewing Co.\n\nImmerse yourself in a cinematic night at Old Mill Brewing Co, Bengaluru - a trendy outdoor oasis where the city's pulse meets relaxed vibes. This hidden gem is the perfect blend of urban excitement and cozy charm, serving up delicious eats and drinks to complement the big screen magic. At Old Mill Brewing Co, every movie night is a unique and unforgettable experience.\n\nScreening Schedule: \n\n22nd  March, Sunday - Zindagi Na Milegi Dobara\n\nGates open at 7:00 pm and the movie starts at 7:30 pm.\n\nSeating:\n\nWe have Bean Bags as seating option available at the venue.\n\nSeating will be allocated on a first come first serve basis. \n\nF\u0026B: \n\nFood and beverage options are available at the venue.\n\nOutside Food is not allowed.\n\nDirections: \n\nSCC SkyCinema is perched on the Rooftop of Old Mill Brewing Co.\n\n**Now you can book a personalized video or photo message to be displayed on-screen during our screenings for up to 1 minute. Select the 'Book a personal on-screen message' while booking the ticket and share your content in advance with us via email to contact@sunsetcinemaclub.in."])</script><script>self.__next_f.push([1,"1a:T495,"])</script><script>self.__next_f.push([1,"Centering the Soul: A Pottery Workshop  Step away from the digital hum and find your center at the wheel. Hobby Ghar invites you to an immersive pottery workshop designed to bridge the gap between ancient heritage and modern mindfulness.  In a world of high-speed updates, come experience the slow, rhythmic beauty of shaping raw earth into form.  The Experience Our studio offers a high-aesthetic, minimalist sanctuary where the focus is entirely on the \"Sensory Audit\" of touch, sight, and sound. Whether you are a first-timer or looking to refine your \"Analog Skills,\" this session is your anchor in a fast-paced world.  The Wheel \u0026 The Hand: Learn the foundational art of centering, opening, and pulling clay on the potter`s wheel.  Cognitive Decompression: A guided, meditative flow designed to combat digital burnout and creative fatigue.  Workshop Highlights Tactile Engagement: Feel the physics of the earth as it responds to your touch and momentum. Expert \"Hobby Guru\" Guidance: Receive personalized instruction in an intimate, supportive environment.  Duration: 30 Minutes. Languages: English, Kannada, Hindi. Artists: shall be implied. 15 people are interested."])</script><script>self.__next_f.push([1,"1b:T5da,"])</script><script>self.__next_f.push([1,"Indulge in a gastronomic journey like no other with our continental cooking masterclass!  Are you ready to embark on a culinary adventure that will transport your taste buds to far-off lands and introduce you to the rich tapestry of global flavors?  Join us for an immersive experience where you`ll master the art of cooking authentic dishes from various countries.  🌍 What to Expect:  Expert Guidance: Our seasoned chefs will guide you through the intricacies of each cuisine, sharing time-honored recipes and culinary secrets.  Cultural Insights: Learn about the history and traditions that influence each dish, gaining a deeper appreciation for the cultures that created them.  Hands-On Cooking: Roll up your sleeves and prepare a delectable feast from start to finish, using the freshest ingredients and authentic cooking techniques.  Culinary Connection: Connect with fellow food enthusiasts, share stories, and forge lasting bonds over a shared love for international cuisine.   Whether you`re eager to craft Italian pasta, savor the spices of Indian curries, or explore the umami of Japanese sushi, this workshop promises an unforgettable culinary experience.  Don`t miss this opportunity to broaden your culinary horizons and become a global chef in your own kitchen! Book your spot now and get ready to embark on a culinary world tour with us! 🍽️🌏✨ Duration: 1 hour 30 minutes. Languages: Bengali, English, Hindi, Kannada. Artists: shall be implied. 657 people are interested."])</script><script>self.__next_f.push([1,"1c:T717,"])</script><script>self.__next_f.push([1,"Step into a vineyard celebration like no other at Big Banyan Harvest Festival 2026 - a vibrant celebration of the vineyard’s harvest season and a joyful coming together of wine, food, music, and rustic experiences set amid the natural beauty of Big Banyan Vineyard \u0026 Resort. Designed as a three-day immersive festival, it captures the romance of grape harvesting traditions while blending them with contemporary lifestyle experiences, making it appealing to families, young audiences, wine lovers, and corporate groups alike. The festival atmosphere is lively yet rooted in authenticity, with décor, storytelling, and activities reflecting the journey from vine to wine.  At its heart, the harvest festival celebrates participation and discovery. Guests step into the role of harvesters through curated grape-picking slots, interactive wine stomping, tasting sessions, vineyard brunches, and themed Hi-Tea experiences. A wide spread of artisan food stalls, smoked meats, barbecue counters, gourmet brunches, dinners and grape-inspired creations, paired with your favourite Big Banyan Wines, elevate the culinary dimension. The Bonfire evenings, curated retail stalls, and rustic vineyard trails add layers of warmth and nostalgia, encouraging guests to slow down, explore, and celebrate the season.  Live entertainment forms the emotional high point each evening. Enjoy live performances every evening by Lagori on Friday, 13th March, Raag The Band on Saturday, 14th March, and a grand finale by Sanjith Hegde on Sunday, 15th March. The mood is electric and exciting. With activities for all ages and picture-perfect vineyard moments, it’s a celebration designed for families, friends, and wine lovers alike 🎶🔥 Duration: 20265 Hours. Languages: Hindi. Artists: shall be implied. 52 people are interested."])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L13\",null,{\"initialActivities\":[{\"id\":\"97\",\"title\":\"Shafi Kollam x Saleem Kodathur Live in Concert\",\"image\":\"https://assets-in.bmscdn.com/nmcms/events/banner/desktop/media-desktop-shafi-kollam-x-saleem-kodathur-live-in-concert-0-2026-2-10-t-12-1-17.jpg\",\"tags\":[\"Event\"],\"priceRange\":\"₹1500.00\",\"location\":\"Bangalore\",\"lastUpdated\":\"3/26/2026\",\"categoryIds\":[\"2\",\"3\",\"6\"],\"categoryNames\":[],\"description\":\"Shafi Kollam x Saleem Kodathur Live in Co
