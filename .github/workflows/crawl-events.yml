name: Event Crawler

on:
  # Run every Tuesday at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 2'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (extract only, do not save)'
        required: false
        default: 'false'
        type: boolean
      query:
        description: 'Single query override (leave blank for all)'
        required: false
        default: ''
        type: string

jobs:
  crawl:
    name: Crawl & Import Events
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run crawler
        env:
          SCRAPINGBEE_API_KEY:       ${{ secrets.SCRAPINGBEE_API_KEY }}
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ -n "${{ github.event.inputs.query }}" ]; then
            ARGS="$ARGS --query=${{ github.event.inputs.query }}"
          fi

          node scripts/crawlEvents.js $ARGS

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-log-${{ github.run_id }}
          path: /tmp/crawler-*.log
          retention-days: 7
          if-no-files-found: ignore
